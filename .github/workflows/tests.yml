name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      # Row-level data is not in the repository, so the reconciliation tests skip here. These tests
      # cover the survival estimator, label rules, downloader, workbook and every dashboard page.
      - run: pytest tests -q
